name: Nonnatech
description: Nonnatech is a New York-based remote patient monitoring (RPM) and virtual
  health company that provides HIPAA-secured technology and clinical services for healthcare
  providers. Its platform integrates biometric sensors and passive home devices to
  deliver real-time analytics, chronic condition management, and population health
  programs across hospitals, health systems, physician practices, payers, ACOs, home
  care, long-term care, and senior living communities. Nonnatech offers turnkey device
  ordering, EHR data integration, and optional clinical monitoring, with no upfront
  costs to providers and roughly 30-day implementation. Nonnatech is a 500 Global
  portfolio company. It does not publish a public developer program, API documentation,
  or developer portal.
